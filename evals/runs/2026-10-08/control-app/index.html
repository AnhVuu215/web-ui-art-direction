:11px;padding:12px 18px;border-bottom:1px solid var(--line)}.piece{padding:26px 18px;border-bottom:1px solid var(--line);min-height:126px;transition:background .15s}.piece:hover{background:#eeece4}.piece-id{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:7px}.piece-title{font-size:18px;font-weight:500;line-height:1.5;display:block;max-width:440px;letter-spacing:-.4px}.piece-title:hover{text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:5px}.badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;line-height:1.5;font-weight:500;white-space:nowrap;padding:6px 9px;border-radius:4px}.badge:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.pending{color:#9d391c;background:#f6e2d8}.editing{color:#4c5944;background:#e5e8df}.approved{color:var(--green);background:#e1e9df}.person,.updated{font-size:12px}.updated{color:var(--muted)}.open-arrow{height:36px;width:36px;border:1px solid #c1c3b6;border-radius:50%;display:grid;place-items:center;font-size:21px;transition:background .15s}.open-arrow:hover{background:var(--ink);color:white}.table-foot{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px;padding-top:15px}.footer{margin-top:48px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.4px}.back{display:inline-flex;align-items:center;gap:10px;font-size:12px;margin-bottom:35px}.back:hover{text-decoration:underline}.detail-heading{padding-bottom:34px;border-bottom:1px solid var(--ink);position:relative}.detail-heading h1{max-width:850px;font-size:54px;line-height:1.3;margin-top:16px}.detail-meta{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:24px;font-size:12px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:50px;padding-top:34px}.detail-summary h2{font-size:21px;margin-bottom:17px}.detail-summary p{color:var(--muted);max-width:520px;font-size:14px}.document{height:174px;border:1px solid var(--line);border-left:4px solid var(--orange);padding:24px;margin-top:25px;position:relative;max-width:550px;overflow:hidden;background:#eeece5}.document .eyebrow{color:var(--muted)}.document strong{display:block;font-size:25px;font-weight:500;max-width:360px;line-height:1.45;letter-spacing:-.6px}.document:after{content:'“';position:absolute;right:14px;top:-6px;font-size:165px;line-height:1.5;color:#d9d8cd;font-family:Georgia,serif;pointer-events:none}.assignment{background:#faf9f5;border:1px solid var(--line);border-radius:7px;padding:25px}.assignment h2{font-size:20px;margin-bottom:8px}.assignment p{font-size:12px;color:var(--muted);margin:0 0 23px}.assignment label{font-size:12px;font-weight:500;display:block;margin-bottom:9px}.assignment select{width:100%;background:var(--paper)}.field-note{font-size:11px;color:var(--muted);margin-top:9px}.primary{min-height:46px;background:var(--orange);color:white;border:1px solid var(--orange);padding:10px 20px;border-radius:5px;font-weight:500;width:100%;margin-top:22px}.primary:hover{background:#bb3b16}.primary:disabled{opacity:.6}.save-status{font-size:12px;line-height:1.7;margin-top:18px;border-radius:4px}.save-status:empty{display:none}.save-status.error{background:#f9e7dd;border-left:3px solid #ad371a;padding:13px;color:#792b19}.save-status.success{background:#e4eee3;border-left:3px solid var(--green);padding:13px;color:#214e36}.save-status.saving{color:var(--muted)}.save-status strong{display:block;margin-bottom:4px}.saved-note{font-size:11px;color:var(--muted);padding-top:16px;border-top:1px solid var(--line);margin-top:19px}.detail-bottom{margin-top:35px;display:flex;justify-content:flex-end}.secondary{border:1px solid #afb1a4;border-radius:5px;min-height:44px;padding:11px 18px;font-size:12px;background:transparent}.secondary:hover{background:var(--soft)}.empty{padding:40px 15px;color:var(--muted)}

@media(max-width:800px){.shell{display:block}.sidebar{padding:19px 24px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px}.mark{font-size:35px}.brand small{font-size:8px;margin-top:5px}.sidebar-label,.side-note{display:none}.nav-link{font-size:11px;padding:10px}.topbar{height:54px;padding:0 24px}.account{font-size:11px}.avatar{height:26px;width:26px}.main{padding:30px 24px}.page-heading{display:block;margin-bottom:26px}h1{font-size:40px;letter-spacing:-1.7px}.date-note{display:none}.feature{grid-template-columns:1fr 125px;min-height:180px}.feature-content{padding:23px}.feature h2{font-size:21px}.feature-art span{font-size:120px}.table-head,.piece{grid-template-columns:minmax(0,1fr) 126px 36px}.person-column{display:none}.detail-grid{grid-template-columns:1fr;gap:28px}.detail-heading h1{font-size:40px}.assignment{max-width:none}.document{max-width:none}.detail-bottom{justify-content:flex-start}.secondary{width:100%}.back{margin-bottom:25px}}
@media(max-width:520px){.sidebar{padding:18px 20px}.topbar{padding:0 20px}.topbar-name{font-size:10px}.main{padding:28px 20px}.eyebrow{font-size:10px;margin-bottom:10px}h1{font-size:36px}.subtitle{font-size:12px;line-height:1.8;margin-top:13px}.feature{grid-template-columns:1fr 70px;min-height:205px;margin-bottom:29px}.feature-content{padding:24px 20px}.feature h2{font-size:20px;line-height:1.5}.feature p{font-size:11px}.feature-art span{font-size:105px;transform:rotate(-12deg) translateX(12px)}.feature-art:after{left:12px;right:12px}.queue-controls{align-items:flex-start;gap:15px;flex-direction:column;margin-bottom:17px}.section-title h2{font-size:20px}.filter-wrap{width:100%;justify-content:space-between}.filter-wrap select{flex:1;max-width:230px}.table-head{display:none}.piece{grid-template-columns:minmax(0,1fr) 36px;gap:8px;padding:20px 2px}.piece>div:first-child{grid-column:1;grid-row:1}.status-column{grid-column:1;grid-row:2;margin-top:6px}.piece .open-arrow{grid-column:2;grid-row:1/3}.piece-title{font-size:17px;line-height:1.55}.person-column{display:block;grid-column:1;grid-row:3;color:var(--muted);margin-top:6px}.person-column:before{content:'Phụ trách: '}.table-foot{font-size:10px;gap:10px}.table-foot span:last-child{text-align:right}.footer{margin-top:34px;font-size:9px}.footer span:last-child{max-width:120px;text-align:right}.detail-heading h1{font-size:36px;letter-spacing:-1.6px}.detail-heading{padding-bottom:26px}.detail-meta{gap:12px;font-size:11px}.detail-grid{padding-top:26px}.detail-summary h2{font-size:20px}.detail-summary p{font-size:12px}.document{padding:22px 19px;height:165px}.document strong{font-size:22px;max-width:260px}.document:after{right:4px;font-size:130px}.assignment{padding:22px}.back{font-size:11px}.detail-bottom{margin-top:24px}}

<body>
<a class="skip" href="#main">Đến nội dung chính</a>
<div class="shell">
<aside class="sidebar" aria-label="Điều hướng không gian biên tập">
<a class="brand" href="?" aria-label="Bản thảo — về hàng chờ"><span class="mark" aria-hidden="true">✳</span><span>Bản thảo<small>KHÔNG GIAN BIÊN TẬP</small></span></a>
<nav aria-label="Điều hướng chính"><p class="sidebar-label">Không gian làm việc</p><a class="nav-link" href="?" aria-current="page"><svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor"/><path d="M6 6h8M6 10h8M6 14h5" stroke="currentColor"/></svg>Bài viết</a></nav>
<div class="side-note"><strong>Mỗi câu chữ, một góc nhìn.</strong>Không gian dành cho những câu chuyện đang thành hình.</div>
</aside>
<div class="workspace"><header class="topbar"><span class="topbar-name">Tòa soạn / Bài viết</span><div class="account"><span class="avatar" aria-hidden="true">BT</span><span>Biên tập viên</span></div></header><main id="main" class="main" tabindex="-1"></main></div>
</div>
<script>
(()=>{
const articles=[{id:'BT-042',title:'Những khoảng thở trong thành phố',status:'pending',assignee:'Mai Anh',updated:'08/10/2026'},{id:'BT-043',title:'Một khu vườn trên sân thượng',status:'editing',assignee:'Minh Khang',updated:'—'},{id:'BT-044',title:'Bữa cơm của những người về muộn',status:'approved',assignee:'Thu Hà',updated:'—'}];
const labels={pending:'Chờ duyệt',editing:'Đang biên tập',approved:'Đã duyệt'};
const main=document.getElementById('main');
const store={get(key,fallback){try{return sessionStorage.getItem('banthao-control-'+key)||fallback}catch{return fallback}},set(key,value){try{sessionStorage.setItem('banthao-control-'+key,value)}catch{}}};
let filter=store.get('filter','all');if(!['all','pending','editing','approved'].includes(filter))filter='all';
let attempts=0,busy=false,activeId='BT-042',draft=store.get('draft','Mai Anh'),saved=store.get('saved','Mai Anh');
if(!['Mai Anh','Minh Khang','Thu Hà'].includes(draft))draft='Mai Anh';if(!['Mai Anh','Minh Khang','Thu Hà'].includes(saved))saved='Mai Anh';articles[0].assignee=saved;
const footer='<footer class="footer"><span>BẢN THẢO © 2026</span><span>Không gian mẫu · Dữ liệu minh họa</span></footer>';
function badge(item){return '<span class="badge '+item.status+'">'+labels[item.status]+'</span>'}
function route(view,state,id){const q=new URLSearchParams();if(view==='detail'){q.set('view','detail');if(id&&id!=='BT-042')q.set('id',id);if(state)q.set('state',state)}history.pushState({},'',location.pathname+(q.size?'?'+q.toString():''));render();}
function queue(){busy=false;const visible=articles.filter(a=>filter==='all'||a.status===filter);main.innerHTML='<div class="page-heading"><div><p class="eyebrow">Góc làm việc của bạn</p><h1>Những câu chuyện<br>đang thành hình.</h1><p class="subtitle">Theo dõi bài viết, kết nối người phụ trách và đưa bản thảo đến bước tiếp theo.</p></div><span class="date-note">Thứ Năm, 08 tháng 10, 2026</span></div><section class="feature" aria-label="Giới thiệu hàng chờ"><div class="feature-content"><p class="eyebrow">Từ bản nháp đến bài viết</p><h2>Một góc nhìn tốt bắt đầu từ<br>một bản thảo được chăm chút.</h2><p>Chọn một bài viết trong hàng chờ để xem thông tin và cập nhật người phụ trách.</p></div><div class="feature-art" aria-hidden="true"><span>“</span></div></section><section aria-labelledby="queue-title"><div class="queue-controls"><div class="section-title"><h2 id="queue-title">Hàng chờ bài viết</h2><span class="count" aria-label="'+visible.length+' bài viết">'+visible.length+'</span></div><div class="filter-wrap"><label for="queue-filter">Trạng thái</label><select id="queue-filter" data-testid="queue-filter"><option value="all">Tất cả bài viết</option><option value="pending">Chờ duyệt</option><option value="editing">Đang biên tập</option><option value="approved">Đã duyệt</option></select></div></div><div class="queue-table"><div class="table-head" aria-hidden="true"><span>BÀI VIẾT</span><span>TRẠNG THÁI</span><span class="person-column">PHỤ TRÁCH</span><span class="date-column">CẬP NHẬT</span><span></span></div>'+visible.map(a=>'<article class="piece"><div><div class="piece-id">'+a.id+'</div><a href="?view=detail'+(a.id!=='BT-042'?'&id='+a.id:'')+'" class="piece-title" data-testid="open-'+a.id+'" data-open="'+a.id+'">'+a.title+'</a></div><div class="status-column">'+badge(a)+'</div><span class="person person-column">'+a.assignee+'</span><span class="updated date-column">'+a.updated+'</span><a class="open-arrow" href="?view=detail'+(a.id!=='BT-042'?'&id='+a.id:'')+'" data-open="'+a.id+'" aria-label="Mở bài '+a.id+': '+a.title+'">↗</a></article>').join('')+'</div><div class="table-foot"><span>'+visible.length+' trên '+articles.length+' bài viết</span><span>Dữ liệu minh họa · 08/10/2026</span></div></section>'+footer;
document.getElementById('queue-filter').value=filter;document.getElementById('queue-filter').addEventListener('change',e=>{filter=e.target.value;store.set('filter',filter);queue();document.getElementById('queue-filter').focus()});main.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();activeId=a.dataset.open;draft=articles.find(x=>x.id===activeId).assignee;attempts=0;store.set('draft',draft);route('detail',null,activeId);main.focus()}));}
function detail(state){const params=new URLSearchParams(location.search);activeId=params.get('id')||'BT-042';const item=articles.find(a=>a.id===activeId)||articles[0];activeId=item.id;if(item.id!=='BT-042'&&attempts===0&&!state)draft=item.assignee;if(state==='error')attempts=Math.max(attempts,1);main.innerHTML='<a class="back" href="?" data-testid="return-queue"><span aria-hidden="true">←</span> Quay lại hàng chờ</a><header class="detail-heading"><p class="eyebrow">Chi tiết bài viết / '+item.id+'</p><h1>'+item.title+'</h1><div class="detail-meta">'+badge(item)+'<span>Cập nhật '+item.updated+'</span><span>Dữ liệu minh họa</span></div></header><div class="detail-grid"><section class="detail-summary" aria-labelledby="overview-title"><h2 id="overview-title">Thông tin bản thảo</h2><p>Bài viết đang ở trạng thái <strong>'+labels[item.status].toLowerCase()+'</strong>. Bạn có thể thay đổi người phụ trách ở bên cạnh, sau đó lưu để cập nhật hàng chờ.</p><div class="document"><p class="eyebrow">'+item.id+' / Bản thảo mẫu</p><strong>'+item.title+'</strong></div></section><form class="assignment" id="assignment"><h2>Người phụ trách</h2><p>Giao bản thảo cho một thành viên trong nhóm biên tập.</p><label for="assignee">Thành viên phụ trách</label><select id="assignee" data-testid="assignee"><option>Mai Anh</option><option>Minh Khang</option><option>Thu Hà</option></select><div class="field-note">Lựa chọn được giữ lại nếu lưu thất bại.</div><button class="primary" type="submit" data-testid="save">'+(state==='error'?'Thử lại':state==='success'?'Đã lưu thay đổi':'Lưu thay đổi')+'</button><div class="save-status" data-testid="save-status" id="save-status" role="status" aria-live="polite" aria-atomic="true"></div><div class="saved-note">Đang phụ trách: '+item.assignee+'</div></form></div><div class="detail-bottom"><a class="secondary" href="?" data-return>← Trở về danh sách bài viết</a></div>'+footer;
const select=document.getElementById('assignee');select.value=draft;select.addEventListener('change',e=>{draft=e.target.value;store.set('draft',draft);const status=document.getElementById('save-status');if(state==='success'){status.textContent='Có thay đổi chưa lưu.';status.className='save-status saving';document.querySelector('[data-testid="save"]').textContent='Lưu thay đổi'}});
const status=document.getElementById('save-status');if(state==='error'){status.className='save-status error';status.innerHTML='<strong>Chưa lưu được thay đổi.</strong>Đây là lỗi mô phỏng trong bản demo. Lựa chọn của bạn vẫn được giữ. Hãy thử lại.'}if(state==='success'){status.className='save-status success';status.innerHTML='<strong>Đã lưu thay đổi.</strong>'+draft+' đã được giao phụ trách bài '+item.id+'.'}main.querySelectorAll('[data-testid="return-queue"],[data-return]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(busy)return;route('queue');const link=main.querySelector('[data-testid="open-'+item.id+'"]');(link||document.getElementById('queue-filter')).focus()}));
document.getElementById('assignment').addEventListener('submit',e=>{e.preventDefault();if(busy)return;busy=true;const button=document.querySelector('[data-testid="save"]');button.disabled=true;select.disabled=true;button.textContent='Đang lưu…';status.className='save-status saving';status.textContent='Đang lưu người phụ trách…';setTimeout(()=>{busy=false;attempts++;if(attempts===1){route('detail','error',item.id)}else{item.assignee=draft;if(item.id==='BT-042'){saved=draft;store.set('saved',saved)}route('detail','success',item.id)}document.querySelector('[data-testid="save"]').focus()},650)});}
function render(){const p=new URLSearchParams(location.search);if(p.get('view')==='detail')detail(p.get('state'));else queue();document.title=(p.get('view')==='detail'?'Chi tiết bài viết':'Hàng chờ bài viết')+' · Bản thảo'}
window.addEventListener('popstate',render);document.querySelectorAll('.brand,.nav-link').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();route('queue');main.focus()}));render();
})();
</script>
